name: Update NYITSec Dojo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dojo configuration and challenge conventions
        run: python scripts/validate_dojo.py
      - name: Test challenge authoring tools
        run: python -m unittest discover -s tests -v

  update:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: pwncollege/dojo-update@v1
        with:
          # Same registered dojo as before, with its updated YAML ID.
          dojo: nyitsec-ctf-2026~36e653d5
          update_code: ${{ secrets.UPDATE_CODE }}
