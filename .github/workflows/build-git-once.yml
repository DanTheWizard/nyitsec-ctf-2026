name: Build offline Git CLI for Forgotten Commit (one time)

on:
  push:
    branches:
      - feat/level3-forgotten-commit
    paths:
      - .github/workflows/build-git-once.yml
      - tools/build_forgotten_git_runtime.py

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install real Git and build bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git
          python3 tools/build_forgotten_git_runtime.py
      - name: Verify bundled command and local history
        env:
          NYITSEC_FORCE_BUNDLED_GIT: "1"
        run: |
          chmod +x level-3/forgotten-commit/bin/git
          level-3/forgotten-commit/bin/git --version
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          from tempfile import TemporaryDirectory
          module = runpy.run_path("level-3/forgotten-commit/.history-builder.py", run_name="unit-test")
          with TemporaryDirectory() as temp:
              project = module["build_history"](Path(temp) / "night-relay")
              assert (project / ".git").is_dir()
              assert not (project / "config/recovery-ledger.toml").exists()
          PY
      - name: Commit only offline bundle and library manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add level-3/forgotten-commit/.git-runtime.tar.gz level-3/forgotten-commit/.git-runtime-packages.txt
          git commit -m "Bundle verified offline Git executable for history challenge"
          git push origin HEAD:feat/level3-forgotten-commit
