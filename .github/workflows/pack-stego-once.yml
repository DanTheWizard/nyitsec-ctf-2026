name: Build temporary steghide lab assets

on:
  push:
    branches:
      - feat/level2-cookie-metadata-steg
    paths:
      - .github/workflows/pack-stego-once.yml
      - tools/build_stego_photo.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and steganography tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y steghide
          python -m pip install pillow
      - name: Generate and round-trip verify embedded evidence
        run: python tools/build_stego_photo.py
      - name: Verify bundled command runs without system steghide
        run: |
          tmpdir="$(mktemp -d)"
          level-2/steg-photo/bin/steghide extract \
            -sf level-2/steg-photo/evidence.jpg \
            -xf "$tmpdir/extracted-note.txt" \
            -p cookie-jar -f
          grep -F 'Response code: PHOTO-CRUMB-26' "$tmpdir/extracted-note.txt"
      - name: Commit generated artifacts to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add level-2/steg-photo/evidence.jpg level-2/steg-photo/.steghide-runtime.tar.gz
          git commit -m "Build and verify genuine steghide photo and offline tool bundle"
          git push origin HEAD:feat/level2-cookie-metadata-steg
      - name: Fallback recovery data if repository push is restricted
        if: failure()
        run: |
          if [ -f level-2/steg-photo/evidence.jpg ]; then
            echo 'BEGIN_NYITSEC_JPEG_BASE64'
            base64 -w0 level-2/steg-photo/evidence.jpg
            echo
            echo 'END_NYITSEC_JPEG_BASE64'
          fi
          if [ -f level-2/steg-photo/.steghide-runtime.tar.gz ]; then
            echo 'BEGIN_NYITSEC_RUNTIME_BASE64'
            base64 -w0 level-2/steg-photo/.steghide-runtime.tar.gz
            echo
            echo 'END_NYITSEC_RUNTIME_BASE64'
          fi
