name: Build dig runtime for Level 3 DNS challenge (one time)

on:
  push:
    branches:
      - feat/level3-dns-treasure-hunt
    paths:
      - .github/workflows/build-dig-once.yml
      - tools/build_dns_dig_runtime.py

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official dig package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bind9-dnsutils
      - name: Package offline binary and libraries
        run: python3 tools/build_dns_dig_runtime.py
      - name: Verify wrapper executes official dig
        run: |
          level-3/dns-treasure-hunt/bin/dig -v
          python3 level-3/dns-treasure-hunt/.dns-server.py &
          echo $! > /tmp/nyitsec-dns-builder.pid
          sleep 1
          level-3/dns-treasure-hunt/bin/dig @127.0.0.1 -p 5300 archive.nyitsec.test MX +short | grep -F 'mx1.archive.nyitsec.test.'
          level-3/dns-treasure-hunt/bin/dig @127.0.0.1 -p 5300 archive.nyitsec.test TXT +short | grep -F 'follow the mail route'
          kill "$(cat /tmp/nyitsec-dns-builder.pid)"
      - name: Commit verified portable tool bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add level-3/dns-treasure-hunt/.dig-runtime.tar.gz level-3/dns-treasure-hunt/.dig-runtime-packages.txt
          git commit -m "Bundle verified ISC dig runtime for offline DNS challenge"
          git push origin HEAD:feat/level3-dns-treasure-hunt
